server {
    listen 443 ssl;
    server_name shreevirajdentalclinic.in www.shreevirajdentalclinic.in;
    ssl_certificate /etc/letsencrypt/live/shreevirajdentalclinic.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shreevirajdentalclinic.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
