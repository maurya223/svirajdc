
name: SVDC CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # =========================
  # CI - Test Django project
  # =========================
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    # Temporary PostgreSQL database for GitHub Actions
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: svdc_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d svdc_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # CI environment variables
    env:
      DJANGO_SETTINGS_MODULE: svdc.settings
      DJANGO_SECRET_KEY: "ci-only-secret-key-not-for-production"
      DEBUG: "False"

      DB_NAME: svdc_ci
      DB_USER: postgres
      DB_PASSWORD: ci_test_password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"

      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: |
          python manage.py check

      - name: Check migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run database migrations
        run: |
          python manage.py migrate --noinput

      - name: Run Django tests
        run: |
          python manage.py test

  # =========================
  # CD - Deploy to AWS
  # =========================
  deploy:
    name: Deploy to AWS Elastic Beanstalk

    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-southeast-2
          application-name: SVDC-prod
          environment-name: SVDC-prod-env
