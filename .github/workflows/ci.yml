# GitHub Action workflow name
name: SVDC CI/CD

# When this workflow should run
on:
  # When code is pushed to main
  push:
    branches:
      - main

  # When a pull request is created for main
  pull_request:
    branches:
      - main

# Define jobs
jobs:

  # =========================
  # CI - Test Django project
  # =========================
  test:
    # Run job on latest Ubuntu environment
    runs-on: ubuntu-latest

    # Individual steps
    steps:

      # Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Django system check
      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: svdc.settings
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          DATABASE_URL: ""
        run: |
          python manage.py check

      # Check migrations
      - name: Check migrations
        env:
          DJANGO_SETTINGS_MODULE: svdc.settings
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          DATABASE_URL: ""
        run: |
          python manage.py makemigrations --check --dry-run

      # Run Django tests
      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: svdc.settings
          SECRET_KEY: "ci-test-secret-key"
          DEBUG: "False"
          DATABASE_URL: ""
        run: |
          python manage.py test

  # =========================
  # CD - Deploy to AWS
  # =========================
  deploy:
    name: Deploy to AWS Elastic Beanstalk

    # Deployment should happen only after CI passes
    needs: test

    # Only deploy when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-southeast-2
          application-name: SVDC-prod
          environment-name: SVDC-prod-env