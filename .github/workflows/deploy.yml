# GitHub Actions workflow ka naam
name: SVDC CD

# SVDC CI complete hone ke baad ye workflow trigger hoga
on:
  workflow_run:
    workflows:
      - "SVDC CI"
    types:
      - completed

# Deployment jobs
jobs:

  deploy:

    # Deployment tabhi hoga jab:
    # 1. SVDC CI successfully complete hua ho
    # 2. CI main branch ke code ke liye run hua ho
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:

      # Repository ka code checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # AWS credentials configure
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # Deploy Django application to AWS Elastic Beanstalk
      - name: Deploy to AWS Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ap-southeast-2
          application-name: SVDC-prod
          environment-name: SVDC-prod-env